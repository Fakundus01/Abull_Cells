# Config del servicio "backend" en Railway.
# En Railway: Settings -> Root Directory = back
#
# Se usa Dockerfile y no Railpack/Nixpacks: el autodetector resolvia un runtime
# de Node para una app de Python y el build fallaba.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Corre las migraciones de Alembic antes de levantar la app nueva.
# Si falla, Railway aborta el deploy y deja la version anterior corriendo.
preDeployCommand = "flask db upgrade"

healthcheckPath = "/api/health"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
